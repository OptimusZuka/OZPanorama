# Builds OZPanorama.exe and runs the tests of the write core on a clean Windows machine.
name: build

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and test
        shell: cmd
        run: build.cmd test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OZPanorama-${{ github.sha }}
          path: build/OZPanorama.exe
          if-no-files-found: error
