# Publishes a release: push the commit to the 'lancamento' branch (or Actions > release > Run workflow).
# The vX.Y.Z tag (same as AppInfo.Version in src/Core.cs) is created by GitHub.
# The release (marked as pre-release/beta) contains the installer, the portable zip and SHA256SUMS.txt.
name: release

on:
  push:
    branches: [lancamento]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }

      - name: Build and test
        shell: cmd
        run: build.cmd test

      - name: Portable zip and SHA-256
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content src\Core.cs -Raw), 'Version = "([^"]+)"').Groups[1].Value
          if (-not $v) { throw "Version not found in src/Core.cs" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force dist\OZPanorama | Out-Null
          Copy-Item build\OZPanorama.exe, README.md, docs\LIMITATIONS.md dist\OZPanorama\
          Compress-Archive -Path dist\OZPanorama -DestinationPath "dist\OZPanorama-$v.zip"
          $h = (Get-FileHash "dist\OZPanorama-$v.zip" -Algorithm SHA256).Hash.ToLower()
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $nv = ($v -replace "-.*", "") + ".0"
          & $iscc "/DAppVersion=$v" "/DNumVersion=$nv" installer\OZPanorama.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setup = "dist\OZPanorama_Setup_$v.exe"
          if (-not (Test-Path $setup)) { throw "Installer not created" }
          $hs = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          Set-Content dist\SHA256SUMS.txt @("$hs  OZPanorama_Setup_$v.exe", "$h  OZPanorama-$v.zip") -Encoding ascii

      - name: Release notes
        shell: pwsh
        run: |
          $v = $env:VERSION
          $sums = (Get-Content dist\SHA256SUMS.txt -Raw).Trim()
          $notes = (Get-Content .github\RELEASE_NOTES.md -Raw).Replace('{VERSION}', $v).Replace('{SHA256SUMS}', $sums)
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          gh release create "v$v" --target "${{ github.sha }}" --prerelease --title "OZPanorama $v" --notes-file notes.md `
            "dist\OZPanorama_Setup_$v.exe" "dist\OZPanorama-$v.zip" "dist\SHA256SUMS.txt"
